<!DOCTYPE html>
<html>
  <head>
    <title>VALCOR::VISUALIZADOR</title>
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <script src="regla/jquery.js"></script>
    <link
      href="regla/regla.css?v=1.1.0"
      rel="stylesheet"
      type="text/css"
      media="all"
    />
    <link rel="stylesheet" href="regla/fa/css/font-awesome.min.css" />
    <style>
      .fix-fixed {
        height: 110px;
      }
      .container {
        width: 100%;
        height: 110px;
        overflow: hidden;
        position: fixed;
        background: white;
        z-index: 9999;
      }

      .col {
        width: 20%;
        float: left;
        min-height: 50px;
      }

      .col2 {
        width: 25%;
        float: left;
        padding-left: 1%;
        padding-right: 1%;
      }

      #logo {
        width: 250px;
        position: fixed;
        bottom: 0;
        right: 0;
        background-color: white;
      }

      .sub-menu-container {
        display: flex;
        width: 100%;
      }

      .sliders-container {
        width: calc(100% - 100px);
        display: flex;
        gap: 8px;
        margin-right: 8px;
        margin-left: 8px;
      }

      @media (max-width: 430px) {
        .sliders-container {
          width: calc(100% - 50px);
        }
        .cerrar-btn {
          display: none;
        }
      }

      .colSlider {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="seleccionar-regla" class="col">
        <i class="fa fa-long-arrow-right" aria-hidden="true"></i> Regla
      </button>
      <button id="seleccionar-angulo" class="col">
        <i class="fa fa-angle-double-right" aria-hidden="true"></i>Regla Angular
      </button>
      <button id="deshacer" class="col">
        <i class="fa fa-undo" aria-hidden="true"></i>Deshacer
      </button>
      <button id="invertir" class="col">
        <i class="fa fa-tint" aria-hidden="true"></i>Invertir Grises
      </button>
      <button id="mover-punto" class="col">
        <i class="fa fa-arrows" aria-hidden="true"></i>Mover Punto Medición
      </button>
      <div class="sub-menu-container">
        <div class="sliders-container">
          <div class="colSlider">
            <div style="margin-bottom: 15px">
              <strong><i class="fa fa-sun-o" aria-hidden="true"></i>Brillo</strong>
            </div>
            <input id="brillo" type="range" min="0" max="200" value="100" />
          </div>
          <div class="colSlider">
            <div style="margin-bottom: 15px">
              <strong
                ><i class="fa fa-tint" aria-hidden="true"></i>Contraste</strong
              >
            </div>
            <input id="contraste" type="range" min="0" max="200" value="100" />
          </div>
          <div class="colSlider">
            <div style="margin-bottom: 15px">
              <strong><i class="fa fa-adjust" aria-hidden="true"></i>Zoom</strong>
            </div>
            <input id="zoom-range" type="range" min="0" max="300" value="100" />
          </div>
        </div>
        <div class="col" style="padding-left: 0%; padding-right: 0%; width: 100px">
          <button
            style="width: 100%"
            id="cambiar-imagen"
            class="col"
            onclick="window.parent.postMessage({type: 'cambiarImagen'}, '*')"
          >
            <i class="fa fa-refresh" aria-hidden="true"></i>Cambiar
          </button>
        </div>
        <div class="col cerrar-btn" style="padding-left: 0%; padding-right: 0%; width: 100px">
          <button
            style="width: 100%"
            id="cerrar-imagen"
            class="col"
            onclick="document.getElementById('modal-confirmacion').style.display='block'"
          >
            <i class="fa fa-times" aria-hidden="true"></i>Cerrar
          </button>
        </div>
      </div>
    </div>
    <div class="fix-fixed"></div>
    <div>
      <div></div>
      <canvas id="medicion" style="background: transparent"></canvas>
    </div>

    <output>
      <ul style="display: none">
        <li>
          Horizontal distance <span style="color: green">(x1 - x)</span>:
          <span id="hd"></span>
        </li>
        <li>
          Vertical distance <span style="color: blue">(y1 - y)</span>:
          <span id="vd"></span>
        </li>
        <li>
          Length
          <span style="color: red"
            >Math.sqrt((x1-x) * (x1-x) + (y1-y) * (y1-y))</span
          >: <span id="length"></span>
        </li>
        <li>
          Angle: Math.atan2( y1-y, x1-x ) * 180 / Math.PI:
          <span id="angle"></span>
        </li>
      </ul>
    </output>

    <div
      id="modal-confirmacion"
      style="
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      "
    >
      <div
        style="
          background-color: #fefefe;
          margin: 15% auto;
          padding: 20px;
          border: 1px solid #888;
          width: 80%;
          max-width: 500px;
          border-radius: 5px;
        "
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
          "
        >
          <h2>Confirmar cierre</h2>
          <span
            style="
              color: #aaa;
              font-size: 28px;
              font-weight: bold;
              cursor: pointer;
            "
            class="close"
            >&times;</span
          >
        </div>
        <div style="padding: 20px 0; text-align: center">
          <p>¿Está seguro que desea cerrar la imagen?</p>
        </div>
        <div
          style="
            border-top: 1px solid #ddd;
            padding-top: 10px;
            text-align: right;
          "
        >
          <button
            id="modal-cancelar"
            style="
              background-color: #6c757d;
              color: white;
              border: none;
              padding: 8px 16px;
              border-radius: 4px;
              cursor: pointer;
            "
            onclick="document.getElementById('modal-confirmacion').style.display='none'"
          >
            Cancelar
          </button>
          <button
            id="modal-confirmar"
            style="
              background-color: #007bff;
              color: white;
              border: none;
              padding: 8px 16px;
              border-radius: 4px;
              margin-left: 10px;
              cursor: pointer;
            "
          >
            Confirmar
          </button>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("cambiar-imagen").onclick = function (e) {
        e.preventDefault();
        window.parent.postMessage({type: 'cambiarImagen'}, '*');
      };

      document.getElementById("cerrar-imagen").onclick = function (e) {
        e.preventDefault();
        document.getElementById("modal-confirmacion").style.display = "block";
      };

      document.querySelector(".close").onclick = function () {
        document.getElementById("modal-confirmacion").style.display = "none";
      };

      document.getElementById("modal-cancelar").onclick = function () {
        document.getElementById("modal-confirmacion").style.display = "none";
      };

      document.getElementById("modal-confirmar").onclick = function () {
        console.log('cerrarVisor');
        window.parent.postMessage({type: 'cerrarVisor'}, '*');
        window.close();
      };
    </script>

    <img id="logo" src="/assets/img/logo.png" />
    <script type="text/javascript">
      var ZOOM = 0;
      function GetUrlParamByName(llave) {
        var url_string = window.location.href;
        var url = new URL(url_string);
        var c = url.searchParams.get(llave);
        return c;
      }
      ZOOM = GetUrlParamByName("zoom");
      valorImagenExterno = `https://valcor.app/upload/${GetUrlParamByName(
        "archivo"
      )}`;
    </script>

    <script src="regla/regla.js?v=1.1.0"></script>
  </body>
</html>
